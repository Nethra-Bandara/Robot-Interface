<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Broadcaster</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            padding: 20px;
        }

        video {
            width: 400px;
            border: 2px solid #444;
            border-radius: 8px;
            display: block;
            margin: 16px 0;
        }

        #status {
            color: #4ade80;
            margin-bottom: 8px;
        }

        #log {
            font-size: 12px;
            color: #888;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <h2>📡 Broadcaster (Laptop)</h2>
    <div id="status">Connecting...</div>
    <video id="localVideo" autoplay muted playsinline></video>
    <div id="log"></div>

    <script>
    const WS_URL = 'wss://robot-interface-production-d0d3.up.railway.app/ws/broadcaster';
    const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const localVideo = document.getElementById('localVideo');

    const peerConnections = {};  // viewerId → RTCPeerConnection
    let localStream = null;
    let ws = null;
    let pendingPc = null;  // the PC waiting for an answer
    let pendingId = null;

    function log(msg) {
        console.log(msg);
        logEl.innerHTML += `<div>${new Date().toLocaleTimeString()} ${msg}</div>`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    async function init() {
        localStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        localVideo.srcObject = localStream;
        log('Webcam started');

        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
            statusEl.textContent = '🟢 Connected to signaling server';
            log('WebSocket connected');
        };

        ws.onclose = () => {
            statusEl.textContent = '🔴 Disconnected — refresh to reconnect';
            log('WebSocket disconnected');
        };

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'ping') return;

            if (data.type === 'new-viewer') {
                log('New viewer joined, creating offer...');
                await createOffer();
            }

            else if (data.type === 'answer') {
                const viewerId = data.viewerId;
                log(`Answer received, viewerId=${viewerId}`);

                // Move pendingPc into peerConnections under the real viewerId
                if (pendingPc) {
                    peerConnections[viewerId] = pendingPc;
                    pendingPc = null;
                    await peerConnections[viewerId].setRemoteDescription(
                        new RTCSessionDescription(data.answer)
                    );
                    log(`Remote description set for viewer ${viewerId}`);
                }
            }

            else if (data.type === 'ice-viewer') {
                const viewerId = data.viewerId;
                const pc = peerConnections[viewerId] || pendingPc;
                if (pc && data.candidate) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
        };
    }

    async function createOffer() {
        // Close any unresolved pending connection
        if (pendingPc) {
            pendingPc.close();
            pendingPc = null;
        }

        const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
        pendingPc = pc;

        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.onicecandidate = (e) => {
            if (e.candidate) {
                ws.send(JSON.stringify({
                    type: 'ice-broadcaster',
                    candidate: e.candidate
                }));
            }
        };

        pc.onconnectionstatechange = () => {
            log(`Connection state: ${pc.connectionState}`);
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: 'offer', offer: pc.localDescription }));
        log('Offer sent');
    }

    init().catch(err => {
        statusEl.textContent = `❌ Error: ${err.message}`;
        log(`Init error: ${err}`);
    });
</script>
</body>

</html>
